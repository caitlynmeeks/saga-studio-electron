<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saga</title>
<!--
The exported player. Written by Saga Studio's publish tab: the studio fills
in the runtime (player.js — the choice grammar's one evaluator) and the
story graph, and copies audio/ and media/ beside this file. Everything is
inline or relative because this page's whole job is to play from file://,
where fetch is blocked and only src attributes may load.

One audio element for the life of the page: the ▶ begin button's click
unlocks it, and every later stretch reuses it — the pattern that survives
autoplay policy everywhere, including iOS.
-->
<style>
:root{--bg:#000;--chrome:#0b0d0c;--line:#222b28;--fg:#ccd6d0;--bright:#f2f7f4;
--dim:#6d7d75;--green:#7fd88f;--amber:#e8b45c;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0}
/* black to the roots: no repaint, no layer churn, no fullscreen backdrop
   may ever glint white between two pictures */
html{background:#000}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono);height:100vh;
height:100dvh;display:grid;grid-template-rows:1fr auto}
#room{position:relative;overflow:hidden;min-height:0;background:#000}
/* a picture arrives invisible and DISSOLVES in over the one still hanging —
   the old only comes down once the new is fully on, so the wall never dips
   to black (or worse) between two shots */
#room img,#room video{position:absolute;inset:0;width:100%;height:100%;
object-fit:contain;background:#000;opacity:0;transition:opacity .45s ease}
#room img.on,#room video.on{opacity:1}
/* the words, the sound line, the chooser and the gate all ride above
   whatever picture is on the wall, whatever order it arrived in */
#caption,#fxcap,#chooser,#gate{z-index:1}
#caption{position:absolute;left:0;right:0;bottom:26px;text-align:center;
padding:0 8vw;font-size:clamp(14px,2.2vw,21px);line-height:1.6;
color:var(--bright);text-shadow:0 1px 3px #000,0 0 14px #000;
opacity:0;transition:opacity .35s,bottom .3s ease}
#caption.on{opacity:1}
/* while the chooser is out, the caption steps up to sit just above it */
#room.choosing #caption{bottom:118px}
/* the sound's own line — "(Foghorn blowing)" — a supertitle at the top so it
   can sit over a standing dialog block without touching it */
#fxcap{position:absolute;left:0;right:0;top:22px;text-align:center;
padding:0 8vw;font-size:clamp(12px,1.7vw,17px);font-style:italic;
color:#cfd6d3;text-shadow:0 1px 3px #000,0 0 12px #000;
opacity:0;transition:opacity .3s}
#fxcap.on{opacity:.85}
/* the title card: big words centred on the wall, faded by the audio clock —
   the transition duration is set per phase from the card's own fade times */
#titlecap{position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;text-align:center;padding:0 10vw;white-space:pre-line;
font-size:clamp(20px,4.5vw,44px);line-height:1.5;letter-spacing:.04em;
color:var(--bright);text-shadow:0 2px 6px #000,0 0 24px #000;
opacity:0;z-index:1;pointer-events:none;transition:opacity .3s}
#titlecap.on{opacity:1}
#gate{position:absolute;inset:0;display:flex;flex-direction:column;gap:18px;
align-items:center;justify-content:center;background:#000d}
#gate h1{font-size:clamp(18px,3vw,30px);color:var(--bright);letter-spacing:.06em;
text-align:center;padding:0 6vw}
#gate button{font-size:17px;padding:12px 30px}
/* The chooser floats OVER the room on a scrim rather than living beside it —
   a layout sibling would resize the stage every time choices came and went,
   and the picture popping larger and smaller is exactly the wrong drama. */
#chooser{position:absolute;left:0;right:0;bottom:0;display:none;gap:10px;
justify-content:center;flex-wrap:wrap;align-items:flex-end;
padding:56px 16px 22px;
background:linear-gradient(180deg,transparent,rgba(0,0,0,.72) 45%,rgba(0,0,0,.9))}
#chooser.on{display:flex}
button{background:#131a17;border:1px solid var(--line);color:var(--fg);
border-radius:7px;padding:10px 18px;font:14px var(--mono);cursor:pointer;max-width:44ch}
button:hover{border-color:var(--green);color:var(--green)}
#bar{display:flex;gap:12px;align-items:center;padding:8px 14px;
background:var(--chrome);border-top:1px solid var(--line);font-size:12px}
#bar b{color:var(--bright);letter-spacing:.08em}
#bar button{padding:3px 11px;font-size:12px;border-radius:5px}
#bar button.lit{border-color:var(--green);color:var(--green)}
.vol{display:flex;gap:5px;align-items:center;color:var(--dim)}
.vol input{width:84px;accent-color:var(--green);background:none;border:0;padding:0}
.mut{color:var(--dim)}.warn{color:var(--amber)}
</style>
</head>
<body>
<div id="room">
  <div id="fxcap"></div>
  <div id="titlecap"></div>
  <div id="caption"></div>
  <div id="chooser"></div>
  <div id="gate"><h1 id="gtitle"></h1><button onclick="begin()">▶ begin</button></div>
</div>
<div id="bar">
  <b id="btitle"></b>
  <span style="flex:1"></span>
  <span id="clock" class="mut"></span>
  <button id="playb" onclick="toggle()">▶ play</button>
  <button onclick="story()" title="back to the top">⟲</button>
  <span class="vol" title="volume">🔊<input type="range" id="vol" min="0" max="100" value="100"
    oninput="setVol(this.value)"></span>
  <button id="ccb" class="lit" onclick="toggleCC()" title="subtitles on / off">CC</button>
  <button id="twb" onclick="toggleTW()" title="typewriter captions — revealed at the pace of the audio">⌨</button>
  <button onclick="fullScreen()" title="full screen">⛶</button>
  <button id="shb" onclick="share()" title="share this story">↗ share</button>
</div>
<script>
/*SAGA_PLAYER*/
</script>
<script>
const GRAPH="/*SAGA_GRAPH*/";
const $=i=>document.getElementById(i);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CH=GRAPH.chunks, BYID=new Map(CH.map(c=>[c.id,c]));
// a stretch is found by the card it starts at; chains follow `upto` onward
const BYFROM=new Map(GRAPH.segments.map(s=>[s.from,s]));
$('gtitle').textContent=GRAPH.title;
$('btitle').textContent=GRAPH.title;

const AUDIO=new Audio();
AUDIO.addEventListener('timeupdate',tick);
let MARKS=[],MARKI=-1,SHOWN=null,TOKEN=0,RUNOFF=null,ASKOFF=null;

// The wall never blinks: the standing picture stays up while the next one
// loads and DECODES off-screen, is dissolved in on top, and only then is
// the old struck. MSEQ is the wall's clock — a swap that finishes loading
// after a newer one began quietly lets go, and a picture that fails to
// arrive changes nothing at all.
let MSEQ=0;
function show(c){
  if(SHOWN&&c&&SHOWN.id===c.id)return;
  const url=c?GRAPH.media[c.media]:null;
  if(c&&!url)return;              // a visual with no packed file changes nothing
  SHOWN=c||null;
  const room=$('room'), seq=++MSEQ;
  const strike=keep=>room.querySelectorAll('img,video')
    .forEach(el=>{ if(el!==keep)el.remove(); });
  if(!c){
    room.querySelectorAll('img,video').forEach(el=>el.classList.remove('on'));
    setTimeout(()=>{ if(seq===MSEQ)strike(null); },500);
    return;
  }
  let el;
  const hang=()=>{
    if(seq!==MSEQ)return void el.remove();   // a newer picture won the wall
    room.insertBefore(el,$('caption'));
    void el.offsetWidth;        // commit opacity 0 first, so .on transitions
    el.classList.add('on');     // (no rAF — an occluded window never fires it)
    setTimeout(()=>{ if(seq===MSEQ)strike(el); },520);
  };
  if(c.mediakind==='video'){
    el=document.createElement('video');
    el.src=url; el.muted=true; el.playsInline=true; el.setAttribute('playsinline','');
    el.addEventListener('loadeddata',()=>{ hang(); el.play().catch(()=>{}); },{once:true});
    el.addEventListener('error',()=>el.remove(),{once:true});
  }else{
    el=document.createElement('img');
    // decode() is preferred (the picture is paint-ready before it hangs) but
    // never trusted alone — a decode that dawdles must not strand the wall
    // on the old shot, so the load event plus a beat is the backstop either
    // way, and a picture that never arrives simply never hangs.
    let hung=false;
    const settle=()=>{ if(hung)return; hung=true;
      if(el.complete&&el.naturalWidth)hang(); else el.remove(); };
    el.addEventListener('load',()=>setTimeout(settle,60),{once:true});
    el.addEventListener('error',settle,{once:true});
    el.src=url;
    if(el.decode)el.decode().then(settle,()=>{});
  }
}
// ── the control bar ───────────────────────────────────────
// The knobs a viewer expects of a player: volume, captions, the typewriter,
// full screen, share. Remembered per browser — a story reopened tomorrow
// sounds and reads the way it was left.
// TW honours the story's typewriter design (its setting, card overrides
// included); unlit, every caption is plain. The author decides the default,
// the viewer keeps the veto.
let CC=true, TW=true, TYPER=null;
const pref=(k,v)=>{ try{ localStorage.setItem('saga.player.'+k,v) }catch(e){} };
function setVol(v){ AUDIO.volume=v/100; pref('vol',v); }
function toggleCC(){ CC=!CC; $('ccb').classList.toggle('lit',CC);
  if(!CC){ caption(''); fxcap(''); } pref('cc',CC?'1':'0'); }
function toggleTW(){ TW=!TW; $('twb').classList.toggle('lit',TW); pref('tw',TW?'1':'0'); }
function fullScreen(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
async function share(){
  const data={title:GRAPH.title,text:'“'+GRAPH.title+'” — an interactive story',
              url:location.href};
  if(navigator.share){ try{ await navigator.share(data); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(location.href);
    const b=$('shb'), was=b.textContent; b.textContent='copied';
    setTimeout(()=>{ b.textContent=was; },1200);
  }catch(e){ prompt('copy the link to this story:',location.href); }
}
try{
  const v=localStorage.getItem('saga.player.vol');
  if(v!=null&&v!==''){ $('vol').value=v; AUDIO.volume=v/100; }
  const c=localStorage.getItem('saga.player.cc'); if(c!=null)CC=c==='1';
  const w=localStorage.getItem('saga.player.tw'); if(w!=null)TW=w==='1';
  $('ccb').classList.toggle('lit',CC); $('twb').classList.toggle('lit',TW);
}catch(e){}

let CAPST={txt:'',chain:false}, CAPQ=[], CAPI=-1;
// this card's typewriter word, else the story's — the ⌨ button vetoes both
const twOf=c=>c&&c.tw!=null?!!c.tw:!!GRAPH.typewriter;
const sfxOf=c=>c&&c.twsfx!=null?!!c.twsfx:!!GRAPH.typesfx;
let ACTX=null, LASTTK=0;
function keyclick(){
  const now=performance.now();
  if(now-LASTTK<45)return;
  LASTTK=now;
  try{
    ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();
    if(ACTX.state==='suspended')ACTX.resume();
    const o=ACTX.createOscillator(), g=ACTX.createGain();
    o.type='square'; o.frequency.value=1500+Math.random()*900;
    g.gain.setValueAtTime(.022,ACTX.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ACTX.currentTime+.03);
    o.connect(g); g.connect(ACTX.destination);
    o.start(); o.stop(ACTX.currentTime+.035);
  }catch(e){}
}
function caption(t,secs,from,tw,sfx){ const el=$('caption');
  if(TYPER){ TYPER(); TYPER=null; }
  if(!t||!CC)return void el.classList.remove('on');
  el.classList.add('on');
  if(TW&&tw&&secs>0)TYPER=SagaPlay.typeCaption(el,t,secs,from||0,sfx?keyclick:null);
  else el.textContent=t; }
function fxcap(t){ const el=$('fxcap');
  if(!t||!CC)return void el.classList.remove('on');
  el.textContent=t; el.classList.add('on'); }
// the title card, driven by the audio clock exactly as in the studio's
// stage: TITLEQ is SagaPlay.titlePlan's arithmetic — the same seconds the
// mixdown cut as silence — and pausing the clock holds the title where it is
let TITLEQ=null, TPHASE='';
function titleClear(){ TITLEQ=null; TPHASE='';
  const el=$('titlecap'); el.style.transitionDuration='.2s'; el.classList.remove('on'); }
function titleTick(t){
  if(!TITLEQ)return;
  const q=TITLEQ;
  const ph=t<q.at?'off':t<q.at+q.fi?'in':t<q.at+q.fi+q.hold?'hold'
    :t<q.end?'out':'off';
  if(ph===TPHASE)return;
  TPHASE=ph;
  const el=$('titlecap');
  if(ph==='off'){ el.style.transitionDuration='.2s'; el.classList.remove('on');
    if(t>=q.end)TITLEQ=null; return; }
  el.style.transitionDuration=Math.max(.01,ph==='in'?q.fi:ph==='out'?q.fo:.01)+'s';
  if(ph==='out')el.classList.remove('on');
  else{ el.textContent=q.text; el.classList.add('on'); }
}

function begin(){ $('gate').style.display='none'; story(); }

async function story(){
  const tok=++TOKEN;
  hideChooser();
  caption(''); fxcap(''); titleClear();   // the last ride's words do not open this one
  CAPST={txt:'',chain:false}; CAPQ=[]; CAPI=-1;   // a fresh ride, a fresh block
  await SagaPlay.walk(CH,{
    playRun:(from,upto)=>playChain(tok,from,upto),
    ask:opts=>ask(tok,opts),
    onEnd:r=>{ if(tok===TOKEN)ended(r); },
  },{},0);
}

// [from, upto) may span several premixed files — the export cuts at every
// jump target as well as at every stop — so play the chain until the stop.
async function playChain(tok,from,upto){
  let at=from;
  while(at!=null&&at!==upto){
    const seg=BYFROM.get(at);
    if(!seg)return true;                  // past the last stretch: the end
    if(seg.file){
      const ok=await playOne(tok,seg);
      if(!ok)return false;
    }
    if(seg.upto==null)return true;
    at=seg.upto;
    const c=BYID.get(at);
    if(c&&(c.type==='choice'||c.when))break;   // the walk's business, not ours
  }
  return TOKEN===tok;
}
function playOne(tok,seg){
  return new Promise(res=>{
    if(tok!==TOKEN)return res(false);
    MARKS=seg.marks||[]; MARKI=-1;
    CAPQ=[]; CAPI=-1;                 // a new stretch, a new page plan
    titleClear();                     // and no title carried over from the last
    RUNOFF=()=>res(false);
    AUDIO.onended=()=>{ RUNOFF=null; res(tok===TOKEN); };
    AUDIO.onerror=()=>{ RUNOFF=null; res(tok===TOKEN); };
    AUDIO.src=seg.file;
    AUDIO.play().catch(()=>{ RUNOFF=null; res(false); });
    $('playb').textContent='⏸ pause';
  });
}
function ask(tok,opts){
  return new Promise(res=>{
    if(tok!==TOKEN)return res(null);
    CAPST={txt:'',chain:false};           // a choice breaks the chain
    $('playb').textContent='▶ play';
    const ch=$('chooser');
    ch.innerHTML=opts.map((o,i)=>`<button data-i="${i}">${esc(o.label)||'…'}</button>`).join('');
    ch.classList.add('on'); $('room').classList.add('choosing');
    ch.onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
      hideChooser(); res(tok===TOKEN?opts[+b.dataset.i]:null); };
    ASKOFF=()=>res(null);
  });
}
function hideChooser(){ const ch=$('chooser');
  ch.classList.remove('on'); ch.onclick=null; $('room').classList.remove('choosing'); ASKOFF=null; }
function ended(){
  $('playb').textContent='▶ play';
  caption(''); fxcap(''); titleClear();
  const ch=$('chooser');
  ch.innerHTML='<button onclick="story()">⟲ once more</button>';
  ch.classList.add('on'); $('room').classList.add('choosing');
}
function pause(){ AUDIO.pause(); $('playb').textContent='▶ resume'; }
function toggle(){
  if(!AUDIO.paused)return pause();
  if(AUDIO.src&&AUDIO.currentTime>0&&!AUDIO.ended&&RUNOFF){
    AUDIO.play(); $('playb').textContent='⏸ pause'; return; }
  story();
}
function tick(){
  const t=AUDIO.currentTime;
  $('clock').textContent=fmt(t);
  let i=MARKI<0?0:MARKI;
  while(i+1<MARKS.length&&MARKS[i+1].at<=t)i++;
  if(!MARKS.length)return;
  if(i===MARKI)return void pageTick(t);   // no new card: pages still turn
  MARKI=i;
  const c=BYID.get(MARKS[i].id);
  if(c){
    let vis=null;
    for(let k=0;k<=i;k++){ const x=BYID.get(MARKS[k].id);
      if(x&&x.type==='visual')vis=x; }
    if(vis)show(vis);
    const dur=(i+1<MARKS.length?MARKS[i+1].at:(AUDIO.duration||t))-MARKS[i].at;
    const kind=c.type||'speech';
    if(kind==='title'){ TITLEQ=SagaPlay.titlePlan(c,MARKS[i].at); TPHASE=''; }
    if((kind==='audio'||kind==='silence')&&c.sub){
      fxcap(c.sub);       // the sound's line; pushed aside by the next words
    }else{
      CAPQ=SagaPlay.captions(CAPST,c,c.sub||(kind==='speech'?c.text:''),MARKS[i].at,dur);
      CAPI=-1;
      const tw=twOf(c), sfx=sfxOf(c);
      CAPQ.forEach(ev=>{ ev.tw=tw; ev.sfx=sfx; });
      if(CAPQ.length&&CAPQ[0].text)fxcap('');
    }
  }
  pageTick(t);
}
// turn the caption's pages against the audio clock — pause freezes them,
// and only the page whose moment has come is shown
function pageTick(t){
  while(CAPI+1<CAPQ.length&&CAPQ[CAPI+1].at<=t){
    CAPI++;
    const ev=CAPQ[CAPI];
    caption(ev.text,ev.secs,ev.from,ev.tw,ev.sfx);
  }
  titleTick(t);         // the title's phases turn on the same clock as pages
}
const fmt=s=>{ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
document.addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); toggle(); } });
</script>
</body>
</html>
