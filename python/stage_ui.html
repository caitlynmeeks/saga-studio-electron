<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saga Stage</title>
<!--
The stage is the audience's side of the studio: a dark room that shows the
current visual, speaks the book, and — when a choice card arrives — asks.
It OWNS playback. The editor window is a remote control and a listener,
nothing more, because the editor is exactly the window that gets occluded
and throttled when this one is fullscreen on the second monitor. One
persistent audio element, held for the life of the page: the first play()
happens inside a user gesture, and every later segment reuses the unlocked
element rather than asking the autoplay policy twice.

Talks to the editor over BroadcastChannel('saga-stage'); works alone in a
plain tab when no editor is listening.
-->
<style>
:root{--bg:#000;--chrome:#0b0d0c;--line:#222b28;--fg:#ccd6d0;--bright:#f2f7f4;
--dim:#6d7d75;--green:#7fd88f;--amber:#e8b45c;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0}
/* black to the roots: no repaint, no layer churn, no fullscreen backdrop
   may ever glint white between two pictures */
html{background:#000}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono);height:100vh;
display:grid;grid-template-rows:1fr}
#room{position:relative;overflow:hidden;min-height:0;background:#000}
/* a picture arrives invisible and DISSOLVES in over the one still hanging —
   the old only comes down once the new is fully on, so the wall never dips
   to black (or worse) between two shots */
#room img,#room video{position:absolute;inset:0;width:100%;height:100%;
object-fit:contain;background:#000;opacity:0;transition:opacity .45s ease}
#room img.on,#room video.on{opacity:1}
/* the words, the sound line, the chooser and the gate all ride above
   whatever picture is on the wall, whatever order it arrived in */
#caption,#fxcap,#chooser,#gate{z-index:1}
/* the dark room says it is dark on purpose — and steps aside the moment
   anything at all is on: a picture, a caption, a sound line, a chooser */
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
align-items:center;justify-content:center;color:var(--dim);font-size:13px;
text-align:center;padding:0 10vw;line-height:1.7}
/* the house wordmark, faint on the dark — a placeholder image can take this
   spot someday, but the room should never be plain black */
#empty::before{content:"SAGA STUDIO";font-family:var(--mono);
font-size:clamp(18px,3.2vw,30px);letter-spacing:.45em;padding-left:.45em;
color:var(--fg);opacity:.14}
#room:has(img,video) #empty,#room:has(#caption.on) #empty,
#room:has(#fxcap.on) #empty,#room:has(#chooser.on) #empty,
#room:has(#titlecap.on) #empty{display:none}
#caption{position:absolute;left:0;right:0;bottom:26px;text-align:center;
padding:0 8vw;font-size:clamp(14px,2.2vw,21px);line-height:1.6;
color:var(--bright);text-shadow:0 1px 3px #000,0 0 14px #000;
opacity:0;transition:opacity .35s,bottom .3s ease}
#caption.on{opacity:1}
/* while the chooser is out, the caption steps up to sit just above it */
#room.choosing #caption{bottom:118px}
/* the sound's own line — "(Foghorn blowing)" — a supertitle at the top so it
   can sit over a standing dialog block without touching it */
#fxcap{position:absolute;left:0;right:0;top:22px;text-align:center;
padding:0 8vw;font-size:clamp(12px,1.7vw,17px);font-style:italic;
color:#cfd6d3;text-shadow:0 1px 3px #000,0 0 12px #000;
opacity:0;transition:opacity .3s}
#fxcap.on{opacity:.85}
/* the title card: big words centred on the wall, faded by the audio clock —
   the transition duration is set per phase from the card's own fade times */
#titlecap{position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;text-align:center;padding:0 10vw;white-space:pre-line;
font-size:clamp(20px,4.5vw,44px);line-height:1.5;letter-spacing:.04em;
color:var(--bright);text-shadow:0 2px 6px #000,0 0 24px #000;
opacity:0;z-index:1;pointer-events:none;transition:opacity .3s}
#titlecap.on{opacity:1}
/* The chooser floats OVER the room on a scrim rather than living beside it —
   a layout sibling would resize the stage every time choices came and went,
   and the picture popping larger and smaller is exactly the wrong drama. */
#chooser{position:absolute;left:0;right:0;bottom:0;display:none;gap:10px;
justify-content:center;flex-wrap:wrap;align-items:flex-end;
padding:56px 16px 22px;
background:linear-gradient(180deg,transparent,rgba(0,0,0,.72) 45%,rgba(0,0,0,.9))}
#chooser.on{display:flex}
#chooser button{background:#131a17;border:1px solid var(--line);color:var(--fg);
border-radius:7px;padding:10px 18px;font:14px var(--mono);cursor:pointer;max-width:44ch}
#chooser button:hover{border-color:var(--green);color:var(--green)}
/* An option that sends you out of the story says so on its face: the arrow
   and the host it goes to, quiet enough to ignore and specific enough to be
   a warning. Nobody should leave a dark room for a browser by surprise. */
#chooser .ext{font-size:11px;color:var(--dim);margin-left:7px;white-space:nowrap}
#chooser button:hover .ext{color:var(--green)}
/* the option the clock will take, when a choice has one */
#chooser button.dflt{border-color:#4a3d22}
/* And the clock itself: a line that drains, not a number. A number in a dark
   room is something to read; this is something to notice out of the corner
   of an eye while you are still deciding. */
.cdown{flex-basis:100%;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.cdown i{display:block;height:100%;background:var(--amber);opacity:.6}
@keyframes cdrain{from{width:100%}to{width:0}}
@media(prefers-reduced-motion:reduce){.cdown i{animation:none!important;width:100%}}
/* The bar floats over the room and sleeps while the story plays — exactly
   the manners the exported web player learned first. Opacity, not display,
   so the room never resizes and the fade is calm. Any pointer, tap or key
   wakes it; stops (a pause, a choice, the end) keep it lit. */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:2;
display:flex;gap:12px;align-items:center;padding:8px 14px;
background:rgba(11,13,12,.92);border-top:1px solid var(--line);font-size:12px;
transition:opacity .35s,transform .35s}
body:not(.barlit) #bar{opacity:0;transform:translateY(10px);pointer-events:none}
/* a lit bar nudges the words up clear of it; they drop back when it sleeps */
body.barlit #caption{bottom:66px}
#bar b{color:var(--bright);letter-spacing:.08em}
#bar button{background:#131a17;border:1px solid var(--line);color:var(--fg);
border-radius:5px;padding:3px 11px;font:12px var(--mono);cursor:pointer}
#bar button:hover{border-color:var(--green);color:var(--green)}
.mut{color:var(--dim)}.warn{color:var(--amber)}
.vol{display:flex;gap:5px;align-items:center;color:var(--dim)}
.vol input{width:84px;accent-color:var(--green);background:none;border:0;padding:0}
#bar button.lit{border-color:var(--green);color:var(--green)}
/* mid-ride, a wall with no picture yet is black ON PURPOSE — the house
   wordmark is for an idle room, never for an opening scene */
body.live #empty{display:none}
/* embedded in the editor (the Game view): pure picture — the engine room
   never shows and never needs chrome */
body.embed{grid-template-rows:1fr}
body.embed #bar{display:none}
#popin{display:none}
/* the pop-out wears the full transport — the same knobs the exported web
   player gives a viewer — plus the one thing only it can offer: the way
   back in. Only the flags readout stays home: the walk that owns those
   runs in the embed, and this window never sees them change. */
body.mirror #vars{display:none}
body.mirror #popin{display:inline-block}
</style>
</head>
<body>
<div id="room">
  <div id="empty"></div>
  <div id="fxcap"></div>
  <div id="titlecap"></div>
  <div id="caption"></div>
  <div id="chooser"></div>
</div>
<div id="bar">
  <span id="title" class="mut">No episode</span>
  <span style="flex:1"></span>
  <span id="vars" class="mut" style="font-size:11px"></span>
  <span id="clock" class="mut"></span>
  <button id="playb" onclick="toggle()">▶ Play</button>
  <button onclick="playFrom(null)" title="back to the top">⟲</button>
  <span class="vol" title="volume">🔊<input type="range" id="vol" min="0" max="100" value="100"
    oninput="setVol(this.value)"></span>
  <button id="ccb" class="lit" onclick="toggleCC()" title="subtitles on / off">CC</button>
  <button onclick="fullScreen()" title="full screen">⛶</button>
  <button id="popin" onclick="popIn()"
    title="Close the stage — the story pauses, and the editor’s Stage button reopens it">×</button>
</div>
<script src="/player.js"></script>
<script src="/desk.js"></script>
<script>
const $=i=>document.getElementById(i);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(p,b){const r=await fetch(p,b?{method:'POST',body:JSON.stringify(b)}:undefined);
  try{return await r.json()}catch(e){return{error:'bad reply'}}}

const qs=new URLSearchParams(location.search);
// The embed — the editor's Game view — is the one true player: it lives in a
// same-origin iframe, so the editor's own clicks satisfy autoplay and it
// never needs a gesture of its own. Every OTHER stage (a pop-out on the
// second monitor, a plain tab) becomes a mirror the moment an owner paints:
// it shows the owner's frames, forwards choice clicks, and never makes a
// sound of its own — one clock, one voice, many walls. A stage that never
// hears an owner stays what it always was: a standalone player with a bar.
const EMBED=qs.has('embed');
if(EMBED)document.body.classList.add('embed');
let MIRROR=false;
// a window the editor popped out is a mirror from birth — it never guesses
if(qs.has('pop')){ MIRROR=true; document.body.classList.add('mirror'); }
function popIn(){ say({type:'popin'}); window.close(); }
// what the dark room means depends on whose room it is
$('empty').textContent=EMBED
  ?'Nothing on stage yet — ▶ Story plays the episode, and clicking a card shows its moment here'
  :MIRROR
    ?'Nothing on stage yet — this window mirrors the editor’s stage'
    :'Nothing on stage yet — ▶ Play starts the episode';
let NAME=qs.get('name')||'';
let DOC=null;              // the open episode, as /api/doc tells it
let MARKS=[], MARKI=-1;    // card start times of the playing stretch
let SHOWN=null;            // the visual currently on the room's wall

// One desk for the life of the page — every stretch plays through SagaDesk's
// node graph, so faders, mutes and the Master land live, mid-word, with no
// seam. The first resume() lands after a click somewhere in the app, which
// unlocks the context; after that it plays rides for as long as the window
// lives. The desk has no timeupdate: a small interval feeds the same tick.
let RIDE=null;             // the desk's handle for the playing stretch
let TOTAL=0;               // the stretch's length, for the bar's clock
let MONV=1, MONMUTE=false; // this machine's loudness — never in any render
setInterval(()=>tick(),250);

// ── the viewer's knobs ────────────────────────────────────
// The same controls the exported web player wears: volume, captions, full
// screen — remembered per browser. Captions are painted by THIS window, so
// CC acts locally in every mode; the sound lives with whoever owns
// playback, so a mirror forwards volume to the embed instead of touching
// its own silent desk. Here CC starts ON — the author writes against the
// words — where the web player starts quiet. The typewriter is the
// author's design and simply plays as written.
let CC=true, TW=true;
const pref=(k,v)=>{ try{ localStorage.setItem('saga.stage.'+k,v) }catch(e){} };
function setVol(v){ pref('vol',v);
  if(MIRROR)say({type:'vol',to:'embed',v:+v});
  else{ MONV=Math.max(0,Math.min(1,(+v||0)/100)); SagaDesk.setMonitor(MONV,MONMUTE); } }
function toggleCC(){ CC=!CC; $('ccb').classList.toggle('lit',CC); pref('cc',CC?'1':'0');
  if(!CC){ $('caption').classList.remove('on'); $('fxcap').classList.remove('on'); }
  // back on: forget the standing keys and ask the embed to re-send the wall,
  // so the words return at once instead of at the next page turn
  else if(MIRROR){ MCAP=' '; MFX=' '; say({type:'hello'}); } }
function fullScreen(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{}); }
try{
  const v0=localStorage.getItem('saga.stage.vol');
  if(v0!=null&&v0!==''){ $('vol').value=v0;
    MONV=Math.max(0,Math.min(1,(+v0||0)/100)); SagaDesk.setMonitor(MONV,MONMUTE); }
  const c0=localStorage.getItem('saga.stage.cc'); if(c0!=null)CC=c0==='1';
  $('ccb').classList.toggle('lit',CC);
}catch(e){}

const BC='BroadcastChannel' in window?new BroadcastChannel('saga-stage'):null;
const say=m=>{ if(BC)BC.postMessage({...m,name:NAME}); };
// what is on the wall right now — kept whole so a mirror that arrives late
// (or pops out mid-scene) gets the full picture, not just the next change
let LASTF={media:null,kind:'',cap:'',fx:'',opts:null,wait:0,dflt:-1,tt:'',tsecs:0,live:0};
const sayFrame=patch=>{ if(!EMBED)return;
  Object.assign(LASTF,patch||{}); say({type:'frame',...LASTF}); };
if(BC)BC.onmessage=e=>{
  const m=e.data||{};
  if(m.type==='hello'){ if(EMBED){ sayFrame();
    say({type:'state',playing:!!(RIDE&&RIDE.playing)}); } return; }  // a late mirror gets the wall
  if(m.type==='frame'&&!EMBED)return void mirror(m);   // an owner is painting
  if(m.type==='choose')return void(CHOOSE&&CHOOSE(m.i));
  if(MIRROR){
    // the mirror's share of the bar: the embed's play state, clock and
    // title — everything else it shows arrives as frames, and it still
    // obeys no transport of its own
    if(m.type==='state'){ $('playb').textContent=m.playing?'⏸ Pause':'▶ Play';
      MPLAY=!!m.playing; barLit(); }   // a stop relights; a play arms the dim
    if(m.type==='clock')$('clock').textContent=m.s||'';
    if(m.type==='open'&&m.name&&m.name!==NAME){ NAME=m.name; load(); }
    return;
  }
  if(m.type==='open'&&m.name){ if(m.name!==NAME)switchStory(m.name); else load(); }
  if(!EMBED&&m.to==='embed')return;    // addressed transport is the embed's alone
  if(m.type==='vol'){
    // the studio's monitor knob, or a mirror's — the bar's own slider follows
    // so the two never disagree about what the room is set to
    if(m.v!=null){ MONV=Math.max(0,Math.min(1,(+m.v||0)/100));
      const s=$('vol'); if(s)s.value=Math.round(+m.v||0); }
    if('mute'in m)MONMUTE=!!m.mute;
    SagaDesk.setMonitor(MONV,MONMUTE);
    return; }
  if(m.type==='mix'){
    // the editor's faders, live: the graph hears them mid-word, and the DOC
    // follows so the next ride's plan seeds from the same numbers
    if(DOC){ DOC.channels=m.channels||[]; DOC.master=m.master||null; }
    SagaDesk.setMix(m.channels,m.master);
    return; }
  if(m.type==='cur')idleShow(m.card);
  if(m.type==='stop')stop();
  if(m.type==='play'){
    if(m.name&&m.name!==NAME)switchStory(m.name);
    story(m.from==null?null:m.from);
  }
  if(m.type==='toggle'){
    // a different story behind the same button is a switch, never a resume —
    // the paused ride belongs to the old episode and must not speak for this one
    if(m.name&&m.name!==NAME){ switchStory(m.name); story(m.from==null?null:m.from); }
    else if(RIDE&&RIDE.playing)pause();
    // the editor names the selected card, and play honours it even mid-pause:
    // a resume replays from THAT card with a fresh document, so everything
    // repainted or reworded during the pause is in the ride — replaying a
    // stale stretch was how an author could never see their own changes
    else if(m.from!=null)story(m.from);
    else if(RIDE&&!RIDE.ended&&RUNOFF){
      RIDE.resume(); $('playb').textContent='⏸ Pause'; say({type:'state',playing:true});
    }else story(null);
  }
  if(m.type==='pause'&&RIDE&&RIDE.playing)pause();
};
say({type:'hello'});
// A mirror announces itself every couple of seconds, so an editor that
// reloaded — and so forgot the window it opened — still keeps its dock
// away. The embed never beats: it IS the dock.
const popbeat=()=>{ if(MIRROR&&!EMBED)say({type:'popped'}); };
setInterval(popbeat,2000); popbeat();
addEventListener('pagehide',()=>{ if(MIRROR&&!EMBED)say({type:'popped-bye'}); });
// what a mirror does: paint whatever the owner says is on its wall. Frames
// arrive whole, so each part repaints only when it actually changed — or a
// caption tick elsewhere would restart the picture and the typewriter here
let MMEDIA='␀', MCAP='␀', MFX='␀', MOPTS='␀', MTT='␀';
function mirror(m){
  if(!MIRROR){ MIRROR=true; document.body.classList.add('mirror'); stop();
    $('empty').textContent='Nothing on stage yet — this window mirrors the editor’s stage'; }
  // every frame names the embed's episode: adopt it, so this window's own
  // transport never asks the embed to switch back to a story it left
  if(m.name&&m.name!==NAME){ NAME=m.name; load(); }
  if('live'in m)document.body.classList.toggle('live',!!m.live);
  if('media'in m&&m.media!==MMEDIA){ MMEDIA=m.media; showMedia(m.media,m.kind); }
  if('tt'in m&&(m.tt||'')!==MTT){ MTT=m.tt||'';
    const el=$('titlecap');
    el.style.transitionDuration=Math.max(.01,m.tsecs||.3)+'s';
    if(MTT){ el.textContent=MTT; el.classList.add('on'); }
    else el.classList.remove('on'); }
  if('cap'in m){ const k=(m.cap||'')+'|'+(m.from||0);
    if(k!==MCAP){ MCAP=k; caption(m.cap,m.secs,m.from,m.tw,false); } }
  if('fx'in m&&(m.fx||'')!==MFX){ MFX=m.fx||''; fxcap(m.fx); }
  if('opts'in m){ const k=JSON.stringify([m.opts||null,m.wait||0,m.dflt]);
    if(k!==MOPTS){ MOPTS=k;
      const ch=$('chooser');
      if(!m.opts){ ch.classList.remove('on'); ch.onclick=null; $('room').classList.remove('choosing'); }
      else{
        ch.innerHTML=optButtons(m.opts,m.dflt==null?-1:m.dflt)+cdown(m.wait||0);
        ch.classList.add('on'); $('room').classList.add('choosing');
        // the mirror never opens the link itself: it says which button was
        // pressed and the window that owns the ride does the rest, so one
        // press is one tab however many stages are watching
        ch.onclick=ev=>{ const b=ev.target.closest('button[data-i]');
          if(b)say({type:'choose',i:+b.dataset.i}); };
      }
    }
  }
}

async function load(curtain){
  if(!NAME){ $('title').textContent='No episode — open one in the studio'; return; }
  DOC=await api('/api/doc?name='+encodeURIComponent(NAME));
  if(!DOC||DOC.error){ DOC=null; $('title').innerHTML=
    '<span class="warn">could not open “'+esc(NAME)+'”</span>'; return; }
  $('title').textContent=DOC.title;
  // the idle curtain is the story's OPENING look and nothing more: a visual
  // that leads the deck. The first picture from deeper in the sequence must
  // never leak backwards onto the wall — a title card would play over
  // scenery meant for minutes later — so a story that opens on words idles
  // on the dark room instead. Never stomp the wall mid-ride: a refresh
  // while playing is about the words, not the picture; and a mirror's wall
  // belongs to the embed's frames alone.
  if(curtain!==false&&!MIRROR&&!(RIDE&&RIDE.playing))show(govVis(0));
}
const card=id=>DOC&&DOC.chunks.find(c=>c.id===id);
// the visual that governs the card at index k: the last ready visual at or
// before it — the picture that card's moment stands in front of
const govVis=k=>{ let v=null;
  if(DOC)for(let i=0;i<=k&&i<DOC.chunks.length;i++){ const x=DOC.chunks[i];
    if(x.type==='visual'&&x.ready)v=x; }
  return v; };

function show(c){
  // same card, same picture — but a card REPAINTED during a pause keeps its
  // id and changes its media, and that change must reach the wall
  if(SHOWN&&c&&SHOWN.id===c.id&&SHOWN.media===c.media)return;
  SHOWN=c||null;
  showMedia(c&&c.media,c&&c.mediakind);
  sayFrame({media:c?c.media:null,kind:c?c.mediakind:''});
}
// The wall never blinks. The standing picture stays up while the next one
// loads and DECODES off-screen; only then is it hung on top, dissolved in,
// and the old struck once the fade has finished. MSEQ is the wall's clock:
// a swap that finishes loading after a newer swap began quietly lets go,
// and a picture that fails to arrive changes nothing at all.
let MSEQ=0;
function showMedia(media,kind){
  const room=$('room'), seq=++MSEQ;
  const strike=keep=>room.querySelectorAll('img,video')
    .forEach(el=>{ if(el!==keep)el.remove(); });
  if(!media){
    // to black: fade whatever hangs, then take it down
    room.querySelectorAll('img,video').forEach(el=>el.classList.remove('on'));
    setTimeout(()=>{ if(seq===MSEQ)strike(null); },500);
    return;
  }
  const url='/api/media?f='+encodeURIComponent(media);
  let el;
  const hang=()=>{
    if(seq!==MSEQ)return void el.remove();   // a newer picture won the wall
    room.insertBefore(el,$('caption'));
    void el.offsetWidth;        // commit opacity 0 first, so .on transitions
    el.classList.add('on');     // (no rAF — an occluded window never fires it)
    setTimeout(()=>{ if(seq===MSEQ)strike(el); },520);
  };
  if(kind==='video'){
    el=document.createElement('video');
    el.src=url; el.muted=true; el.playsInline=true;
    // first frame ready is the film's "decoded" — then muted play is exempt
    // from autoplay policy. No loop: it plays once and holds its last frame;
    // the soundtrack is the cards, and a loop would turn an establishing
    // shot into a gif.
    el.addEventListener('loadeddata',()=>{ hang(); el.play().catch(()=>{}); },{once:true});
    el.addEventListener('error',()=>el.remove(),{once:true});
  }else{
    el=document.createElement('img');
    // decode() is preferred (the picture is paint-ready before it hangs) but
    // never trusted alone — a decode that dawdles must not strand the wall
    // on the old shot, so the load event plus a beat is the backstop either
    // way, and a picture that never arrives simply never hangs.
    let hung=false;
    const settle=()=>{ if(hung)return; hung=true;
      if(el.complete&&el.naturalWidth)hang(); else el.remove(); };
    el.addEventListener('load',()=>setTimeout(settle,60),{once:true});
    el.addEventListener('error',settle,{once:true});
    el.src=url;
    if(el.decode)el.decode().then(settle,()=>{});
  }
}

// the typing sound: a soft key-click per revealed character, rate-limited so
// fast captions clatter instead of buzzing. WebAudio, made on the spot — no
// asset, no request; if the context is not allowed yet, silence, no error.
let ACTX=null, LASTTK=0;
function keyclick(){
  const now=performance.now();
  if(now-LASTTK<45)return;
  LASTTK=now;
  try{
    ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();
    if(ACTX.state==='suspended')ACTX.resume();
    const o=ACTX.createOscillator(), g=ACTX.createGain();
    o.type='square'; o.frequency.value=1500+Math.random()*900;
    g.gain.setValueAtTime(.022,ACTX.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ACTX.currentTime+.03);
    o.connect(g); g.connect(ACTX.destination);
    o.start(); o.stop(ACTX.currentTime+.035);
  }catch(e){}
}

let TYPER=null, CAPST={txt:'',chain:false}, CAPQ=[], CAPI=-1;
function caption(text,secs,from,tw,sfx){
  const el=$('caption');
  if(TYPER){ TYPER(); TYPER=null; }
  sayFrame({cap:text||'',secs,from,tw:!!tw});
  if(!text||!CC)return void el.classList.remove('on');
  el.classList.add('on');
  if(TW&&tw&&secs>0)TYPER=SagaPlay.typeCaption(el,text,secs,from||0,sfx?keyclick:null);
  else el.textContent=text;
}
function fxcap(t){
  const el=$('fxcap');
  sayFrame({fx:t||''});
  if(!t||!CC)return void el.classList.remove('on');
  el.textContent=t; el.classList.add('on');
}

// ── the title card ────────────────────────────────────────
// Driven by the audio clock, never by timers: TITLEQ is the plan (from
// SagaPlay.titlePlan — the same arithmetic as the mixdown's silence), and
// each tick decides which phase the clock is in. Pausing pauses the clock,
// so a held title stays held; the fades themselves are CSS transitions
// whose durations are the card's own fade times.
let TITLEQ=null, TPHASE='';
function titleClear(){
  TITLEQ=null; TPHASE='';
  const el=$('titlecap');
  el.style.transitionDuration='.2s'; el.classList.remove('on');
  sayFrame({tt:'',tsecs:.2});
}
function titleTick(t){
  if(!TITLEQ)return;
  const q=TITLEQ;
  const ph=t<q.at?'off':t<q.at+q.fi?'in':t<q.at+q.fi+q.hold?'hold'
    :t<q.end?'out':'off';
  if(ph===TPHASE)return;
  TPHASE=ph;
  const el=$('titlecap');
  if(ph==='off'){
    el.style.transitionDuration='.2s'; el.classList.remove('on');
    sayFrame({tt:'',tsecs:.2});
    if(t>=q.end)TITLEQ=null;
    return;
  }
  const secs=ph==='in'?q.fi:ph==='out'?q.fo:.01;
  el.style.transitionDuration=Math.max(.01,secs)+'s';
  if(ph==='out'){ el.classList.remove('on'); sayFrame({tt:'',tsecs:q.fo}); }
  else{ el.textContent=q.text; el.classList.add('on');
        sayFrame({tt:q.text,tsecs:secs}); }
}

// ── the story ─────────────────────────────────────────────
// SagaPlay.walk drives everything; this page only supplies the hooks. TOKEN
// abandons a walk the moment a newer one starts — the old walk's pending
// promises see a stale token and resolve false, and the engine lets go.
let TOKEN=0, VARS={}, ASKOFF=null, RUNOFF=null, CHOOSE=null;
// this card's typewriter word, else the story's — same for the key sound
const twOf=c=>c&&c.tw!=null?!!c.tw:!!(DOC&&DOC.typewriter);
const sfxOf=c=>c&&c.twsfx!=null?!!c.twsfx:!!(DOC&&DOC.typesfx);
// Where a ride wanted to begin. A freshly opened window may not be allowed to
// make sound until it is clicked — if the first play() is refused, the wish
// is kept, and the ▶ button's very human gesture grants it from that card.
let PEND=null;

async function story(fromId){
  const tok=++TOKEN;
  PEND=fromId==null?null:fromId;
  hideChooser();
  caption(''); fxcap(''); titleClear();   // the last ride's words do not open this one
  // Fetch the document fresh for every ride. The audio is mixed per press by
  // the server and is always current — but captions, choices and visuals are
  // read from THIS copy, and playing from a snapshot taken when the window
  // opened meant an edited subtitle never reached the stage until a reload.
  await load(false);
  if(!DOC||tok!==TOKEN)return;
  // From the top, the slate is clean. From a card, the flags of the LAST
  // ride carry over — which is what testing wants: play through making
  // choices, fix the thing, replay from right there with the state you had.
  if(fromId==null)VARS={};
  CAPST={txt:'',chain:false}; CAPQ=[]; CAPI=-1;   // a fresh ride, a fresh block
  paintVars();
  let start=0;
  if(fromId!=null){ const k=DOC.chunks.findIndex(c=>c.id===fromId); if(k>=0)start=k; }
  // the ride opens on the visual that governs its starting card — or on
  // black, which is what a title card or an opening line deserves to
  // stand against when its own picture has not yet had its moment
  show(govVis(start));
  setLive(true);
  await SagaPlay.walk(DOC.chunks,{
    playRun:(from,upto)=>playRun(tok,from,upto),
    ask:(opts,c,to)=>ask(tok,opts,c,to),
    onEnd:reason=>{ if(tok===TOKEN)ended(reason); },
  },VARS,start);
}

// live = a ride is on (paused counts): the dark room's wordmark steps out of
// the way, because mid-ride black is a moment on purpose, not an empty house
function setLive(on){ document.body.classList.toggle('live',!!on); sayFrame({live:on?1:0}); }

function playRun(tok,from,upto){
  return new Promise(res=>{
    (async()=>{
      if(tok!==TOKEN)return res(false);
      const r=await api('/api/mix_plan',{name:NAME,from,upto});
      if(tok!==TOKEN)return res(false);
      // an empty stretch — nothing renderable between two stops — is not a
      // reason to halt the story; the walk simply continues past it
      if(!r.ok)return res(true);
      // the desk seeds from the ride's own fresh DOC; every {type:'mix'}
      // that arrives mid-stretch lands on the same nodes, live
      SagaDesk.setMix(DOC.channels,DOC.master);
      SagaDesk.setMonitor(MONV,MONMUTE);
      // sound must be granted before the ride is armed — a refusal keeps
      // the wish (PEND) for the ▶ button's very human gesture to grant
      if(!await SagaDesk.resume()||tok!==TOKEN){ setLive(false); return res(false); }
      PEND=null;                                       // sound granted: wish spent
      if(RIDE)RIDE.stop();            // a restart mid-ride lets the old one go
      MARKS=r.marks||[]; MARKI=-1;
      CAPQ=[]; CAPI=-1;               // a new stretch, a new page plan
      titleClear();                   // and no title carried over from the last
      TOTAL=r.total||0;
      RUNOFF=()=>res(false);
      const h=RIDE=SagaDesk.play(r,{onended:()=>{
        if(RIDE!==h)return;
        RUNOFF=null; res(tok===TOKEN);
      }});
      $('playb').textContent='⏸ Pause';
      say({type:'state',playing:true});
      barLit();
    })();
  });
}

// The host a link goes to, which is the whole of the warning: "amalgamated.example"
// tells a listener what they are about to open in a way the full URL does not.
const linkHost=u=>{ try{ return new URL(u).host.replace(/^www\./,''); }
  catch(e){ return 'a web page'; } };
// One set of buttons, drawn the same way whether this window is the one
// playing or a mirror of it — a mirror that drew a link differently would be
// a different story on the second monitor.
const optButtons=(opts,di)=>opts.map((o,i)=>{
  const u=o.url||'';
  return `<button data-i="${i}"${i===di?' class="dflt"':''}`+
    (u?` title="opens ${esc(linkHost(u))} in your own browser, in a tab of its own"`:'')+
    `>${esc(o.label)||'…'}${u?` <span class="ext">↗ ${esc(linkHost(u))}</span>`:''}</button>`;
}).join('');
const cdown=secs=>secs>0
  ?`<div class="cdown"><i style="animation:cdrain ${secs}s linear forwards"></i></div>`:'';
// A link leaves through the server rather than through window.open, because
// the popped-out stage is a CHILD window of the Electron shell and a child
// does not inherit the handler that turns window.open into "the real
// browser" — clicked in the theatre, the page would have opened in a bare
// Electron window with no address bar and no way back. The server has the
// one call that always means the machine's own browser. The exported player
// is a web page with no server behind it and opens its own links; both ask
// the same grammar first, so http and https are all either can reach.
function openLink(u){ if(u)api('/api/open_link',{url:u}); }
let CLOCK=null;

function ask(tok,opts,c,to){
  return new Promise(res=>{
    if(tok!==TOKEN)return res(null);
    CAPST={txt:'',chain:false};           // a choice breaks the chain
    $('playb').textContent='▶ Play';
    say({type:'state',playing:false});
    // a choice card's subtitle is the question over the buttons
    if(c&&c.sub)caption(c.sub,0,0,false,false);
    const ch=$('chooser');
    const di=to?opts.indexOf(to.option):-1;
    const wire=opts.map(o=>({label:o.label||'',url:o.url||''}));
    ch.innerHTML=optButtons(opts,di)+(to?cdown(to.secs):'');
    ch.classList.add('on'); $('room').classList.add('choosing');
    say({type:'choices',opts:wire,wait:to?to.secs:0,dflt:di});
    sayFrame({opts:wire,wait:to?to.secs:0,dflt:di});
    let done=false;
    const fin=o=>{ if(done)return; done=true; hideChooser(); res(tok===TOKEN?o:null); };
    // A pressed option opens its page; a clock that ran out does NOT. Sending
    // somebody's browser somewhere because they said nothing is not a thing
    // a story gets to do — the silence takes the option, and only the option.
    const pick=i=>{ const o=opts[i]; if(!o)return; if(o.url)openLink(o.url); fin(o); };
    ch.onclick=e=>{ const b=e.target.closest('button[data-i]'); if(b)pick(+b.dataset.i); };
    CHOOSE=pick;                          // the editor and the mirrors choose too
    if(to)CLOCK=setTimeout(()=>fin(to.option),to.secs*1000);
    ASKOFF=()=>{ done=true; res(null); };
  });
}
function hideChooser(){ const ch=$('chooser');
  clearTimeout(CLOCK); CLOCK=null;      // no clock outlives the question it ran on
  ch.classList.remove('on'); ch.onclick=null; $('room').classList.remove('choosing');
  ASKOFF=null; CHOOSE=null; paintVars();
  say({type:'choices',opts:null,wait:0,dflt:-1});
  sayFrame({opts:null,wait:0,dflt:-1}); }
// The story's flags right now — the walk mutates VARS as choices apply their
// sets, and seeing them is half of testing a branch.
function paintVars(){
  const t=Object.entries(VARS).filter(([,v])=>v)
    .map(([k,v])=>v===1?k:k+'='+v).join(' · ');
  $('vars').textContent=t;
  $('vars').title=t?'the story’s flags — carried over when you play from a card':'';
}

function ended(reason){
  setLive(false);
  barLit();
  $('playb').textContent='▶ Play';
  say({type:'state',playing:false});
  caption(''); fxcap(''); titleClear();
  say({type:'stopped',card:MARKS[MARKI]?MARKS[MARKI].id:null});
  const ch=$('chooser');
  ch.innerHTML=(reason&&reason.startsWith('dangling:')
      ?`<span class="warn" style="align-self:center">no card is tagged “${esc(reason.slice(9))}” — the story had nowhere to go</span>`
      :'')+`<button onclick="story(null)">⟲ Once More</button>`;
  ch.classList.add('on'); $('room').classList.add('choosing');
}

// ── transport ─────────────────────────────────────────────
function pause(){
  if(RIDE)RIDE.pause();                // the run's promise stays pending —
                                       // the clock and every armed source
                                       // freeze as one under ctx.suspend
  $('playb').textContent='▶ Resume';
  say({type:'state',playing:false});
  say({type:'stopped',card:MARKS[MARKI]?MARKS[MARKI].id:null});
  barLit();
}
function toggle(){
  // the mirror's button drives the embed — one clock, one voice
  if(MIRROR)return void say({type:'toggle',to:'embed'});
  if(RIDE&&RIDE.playing)return pause();
  if(RIDE&&!RIDE.ended&&RUNOFF){
    RIDE.resume(); $('playb').textContent='⏸ Pause'; barLit(); return;   // resume the run
  }
  story(PEND);      // an ungranted "play from card N" wish is honoured here
}
function stop(){
  TOKEN++;
  setLive(false);
  caption(''); fxcap(''); titleClear();
  if(RUNOFF){ const f=RUNOFF; RUNOFF=null; f(); }
  if(ASKOFF){ const f=ASKOFF; ASKOFF=null; f(); }
  if(RIDE){ RIDE.stop(); RIDE=null; }
  hideChooser();
  $('playb').textContent='▶ Play';
  say({type:'state',playing:false});
  barLit();
}
// A different story arriving — by open, play or toggle — ends the old ride
// completely: its pause, its pending wish, its flags, its audio. Nothing of
// one episode may leak into another's playback, and the resume branch must
// never find yesterday's episode still loaded in the deck.
function switchStory(n){
  stop();                              // stop() lets the desk's ride go whole
  VARS={}; PEND=null; paintVars();
  NAME=n; load();
}
function playFrom(from){
  if(MIRROR)return void say({type:'play',to:'embed'});
  story(from); }

// the viewfinder: idle OR PAUSED, the stage shows the moment of the card
// being edited — its governing visual and its words — so writing happens
// against the picture. Paused matters: stopping the ride to repaint a card
// and then clicking it is exactly when the author needs the wall to show
// the new picture, and the doc is refetched for the same reason — the
// change being checked lives in a document this window has not seen yet.
async function idleShow(id){
  if(!NAME||(RIDE&&RIDE.playing)||ASKOFF)return;
  const d=await api('/api/doc?name='+encodeURIComponent(NAME));
  if(d&&!d.error)DOC=d;
  if(!DOC)return;
  const k=DOC.chunks.findIndex(c=>c.id===id); if(k<0)return;
  show(govVis(k));
  const c=DOC.chunks[k], kind=c.type||'speech';
  if(kind==='title'){
    // writing a title against the wall it will stand on: shown at once,
    // no clock, no fade — the plan only runs during playback
    TITLEQ=null; TPHASE='idle';
    const el=$('titlecap');
    el.style.transitionDuration='.15s'; el.textContent=c.text||'';
    if(c.text)el.classList.add('on'); else el.classList.remove('on');
    sayFrame({tt:c.text||'',tsecs:.15});
    caption('',0,0,false,false); fxcap('');
    return;
  }
  if(TPHASE==='idle')titleClear();   // clicking away takes the idle title down
  if((kind==='audio'||kind==='silence')&&c.sub){ caption('',0,0,false,false); fxcap(c.sub); }
  else{ fxcap('');
    caption(c.sub||(kind==='speech'?c.text:'')||'',0,0,false,false); }
}

function tick(){
  if(!RIDE)return;                        // no ride, no clock to follow
  const t=RIDE.time();
  $('clock').textContent=fmt(t)+(TOTAL?' / '+fmt(TOTAL):'');
  if(EMBED)say({type:'clock',s:$('clock').textContent});
  let i=MARKI<0?0:MARKI;
  while(i+1<MARKS.length&&MARKS[i+1].at<=t)i++;
  if(!MARKS.length)return;
  if(i===MARKI)return void pageTick(t);   // no new card: pages still turn
  MARKI=i;
  const c=card(MARKS[i].id);
  if(c){
    // the wall shows the last visual at or before this moment in the stretch;
    // a stretch with no visual of its own leaves the wall as it stands
    let vis=null;
    for(let k=0;k<=i;k++){ const x=card(MARKS[k].id);
      if(x&&x.type==='visual'&&x.ready)vis=x; }
    if(vis)show(vis);
    // the subtitle wins over the spoken text — "Teide" on screen while the
    // booth was fed "tay-dee" — and it is the only words a voiced card has.
    const dur=(i+1<MARKS.length?MARKS[i+1].at:(TOTAL||t))-MARKS[i].at;
    const kind=c.type||'speech';
    if(kind==='title'){ TITLEQ=SagaPlay.titlePlan(c,MARKS[i].at); TPHASE=''; }
    if((kind==='audio'||kind==='silence')&&c.sub){
      // the sound's own line: it never touches the dialog caption or a
      // standing chain, and the next real words push it aside
      fxcap(c.sub);
    }else{
      // the card's caption plan: a paragraph becomes pages, each with its
      // slice of the card's audio — replayed below against the clock
      CAPQ=SagaPlay.captions(CAPST,c,c.sub||(kind==='speech'?c.text:''),MARKS[i].at,dur);
      CAPI=-1;
      // the card's typewriter word rides on its pages
      const tw=twOf(c), sfx=sfxOf(c);
      CAPQ.forEach(ev=>{ ev.tw=tw; ev.sfx=sfx; });
      if(CAPQ.length&&CAPQ[0].text)fxcap('');
    }
  }
  pageTick(t);
  paintVars();          // sets applied at the last choice are visible by now
  say({type:'playing',card:MARKS[i].id});
}
// turn the caption's pages against the audio clock — pause freezes them,
// and only the page whose moment has come is shown
function pageTick(t){
  while(CAPI+1<CAPQ.length&&CAPQ[CAPI+1].at<=t){
    CAPI++;
    const ev=CAPQ[CAPI];
    caption(ev.text,ev.secs,ev.from,ev.tw,ev.sfx);
  }
  titleTick(t);         // the title's phases turn on the same clock as pages
}
const fmt=s=>{ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

document.addEventListener('keydown',e=>{
  if(e.key===' '){ e.preventDefault(); toggle(); }
});

// ── the bar sleeps while the story plays ──────────────────
// Same manners as the exported web player: lit on any pointer, tap or key,
// dark again a few seconds into playback. A stopped stage keeps its knobs —
// a pause, a choice and the end are exactly the moments a viewer reaches
// for them. A mirror owns no desk, so it judges "playing" by the state
// messages the embed broadcasts.
let BART=null, MPLAY=false;
function barLit(){
  document.body.classList.add('barlit');
  clearTimeout(BART); BART=setTimeout(barDim,2800);
}
function barDim(){
  const playing=MIRROR?MPLAY:!!(RIDE&&RIDE.playing);
  if(!playing||$('chooser').classList.contains('on'))return;
  document.body.classList.remove('barlit');
}
['pointermove','pointerdown','keydown'].forEach(ev=>
  document.addEventListener(ev,barLit,{passive:true}));
// stops relight the knobs even when the pointer never moved; a fresh play
// just arms the countdown again — the transport calls barLit at each turn,
// since the desk fires no element events
barLit();

load();
</script>
</body>
</html>
